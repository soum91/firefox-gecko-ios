name: Repair XUL loader signature in Firefox Gecko
on:
  push:
    paths:
      - .github/workflows/repair-xul-signature.yml
      - scripts/repair_xul_signature.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Fetch existing working compilation from GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input dist
          gh release download v159.0.4-gecko-helper-test --repo "$GITHUB_REPOSITORY" --pattern 'Firefox-Gecko-Helper-Test.ipa' --dir input
          test -s input/Firefox-Gecko-Helper-Test.ipa
      - name: Rename and resign XUL dylib and all dependent code
        timeout-minutes: 24
        run: |
          set -o pipefail
          python3 -u scripts/repair_xul_signature.py input/Firefox-Gecko-Helper-Test.ipa dist/Firefox-Gecko-XUL-Signature-Fix.ipa --version 159.0.5 --build 78954 2>&1 | tee dist/repair-log.txt
          unzip -tq dist/Firefox-Gecko-XUL-Signature-Fix.ipa
      - name: Upload test IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Firefox-Gecko-XUL-Signature-Fix-v159.0.5
          path: |
            dist/Firefox-Gecko-XUL-Signature-Fix.ipa
            dist/repair-log.txt
          if-no-files-found: error
      - name: Publish tagged prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v159.0.5-xul-signature-fix dist/Firefox-Gecko-XUL-Signature-Fix.ipa --repo "$GITHUB_REPOSITORY" --title "Firefox Gecko 159.0.5: XUL dyld code-signature repair" --notes "Diagnostic unsigned IPA with renamed XUL.dylib, updated Mach-O load commands, and nested-code ad-hoc signatures verified on macOS. Must re-sign with your purchased certificate in FlareStore including all dylibs and helper. Addresses device log dyld error 'code signature invalid' for XUL. Device launch not yet verified. Still uses Reynard front end rather than original Firefox interface." --prerelease --latest=false
      - name: Update FlareStore feed after asset published
        env:
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime,json,os
          from pathlib import Path
          p=Path('source.json')
          feed=json.loads(p.read_text())
          app=next(a for a in feed['apps'] if a['bundleIdentifier']=='com.soum91.FirefoxGecko')
          name='Firefox-Gecko-XUL-Signature-Fix.ipa'
          url=f"https://github.com/{os.environ['REPO']}/releases/download/v159.0.5-xul-signature-fix/{name}"
          ipa=Path('dist')/name
          date=datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          note="Gecko XUL.dylib code-signature and dyld dependency diagnostic. Retains essential helper; must re-sign all embedded libraries and helper using your certificate. Launch not verified. Reynard UI."
          ent={'version':'159.0.5','buildVersion':'78954','date':date,'localizedDescription':note,'downloadURL':url,'size':ipa.stat().st_size,'minOSVersion':'16.1'}
          app['versions']=[ent]+[v for v in app.get('versions',[]) if v.get('version')!='159.0.5']
          app.update(version='159.0.5',versionDate=date,versionDescription=note,localizedDescription=note,downloadURL=url,size=ent['size'])
          p.write_text(json.dumps(feed,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source.json
          if ! git diff --cached --quiet; then
            git commit -m 'Index Gecko 159.0.5 XUL dyld signature repair in FlareStore'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
