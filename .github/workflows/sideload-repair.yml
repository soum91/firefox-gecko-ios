name: Repair Firefox Gecko IPA with essential child-process helper

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sideload-repair.yml

permissions:
  contents: write

jobs:
  repackage:
    name: Repackage existing IPA without Gecko compilation
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout packaging scripts and feed
        uses: actions/checkout@v4

      - name: Install lightweight signing utility
        run: |
          brew install ldid
          command -v ldid

      - name: Download previously compiled Gecko IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input dist
          gh release download v159.0.2 --repo "$GITHUB_REPOSITORY" --pattern 'Firefox-Gecko.ipa' --dir input
          test -s input/Firefox-Gecko.ipa
          unzip -tq input/Firefox-Gecko.ipa

      - name: Repackage Gecko sideload test (preserve child-process helper)
        run: |
          python3 scripts/repackage_sideload.py input/Firefox-Gecko.ipa dist/Firefox-Gecko-Helper-Test.ipa --version 159.0.4 --build 78953 --keep-gecko-helper
          unzip -tq dist/Firefox-Gecko-Helper-Test.ipa
          unzip -l dist/Firefox-Gecko-Helper-Test.ipa | grep -q 'Payload/Reynard.app/Info.plist'
          unzip -Z1 dist/Firefox-Gecko-Helper-Test.ipa | grep -Fq 'Payload/Reynard.app/PlugIns/Reynard Helper.appex/Info.plist'
          ! unzip -Z1 dist/Firefox-Gecko-Helper-Test.ipa | grep -Eq 'PlugIns/(ReynardAutoFill|OpenIn|FirefoxDownloadWidget).appex/'

      - name: Upload standalone diagnostic IPA
        uses: actions/upload-artifact@v4
        with:
          name: Firefox-Gecko-Helper-Test-v159.0.4
          path: dist/Firefox-Gecko-Helper-Test.ipa
          if-no-files-found: error

      - name: Publish separate sideload test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v159.0.4-gecko-helper-test dist/Firefox-Gecko-Helper-Test.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Firefox Gecko 159.0.4 (Gecko helper diagnostic)' \
            --notes 'Unsigned Gecko startup diagnostic repackaged from compiled v159.0.2. Preserves essential Reynard Helper.appex for Gecko child processes, strips nonessential AutoFill/share/widget extensions, removes old signing files, and clears inherited main/helper entitlements. Sideloader must re-sign BOTH app and helper with provisioned entitlements. Not a native Firefox wrapper or Mozilla-signed application. Launch not verified.' \
            --prerelease --latest=false

      - name: Update FlareStore feed with distinct test version
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          path = Path("source.json")
          source = json.loads(path.read_text(encoding="utf-8"))
          app = source["apps"][0]
          version, build = "159.0.4", "78953"
          date = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          ipa = Path("dist/Firefox-Gecko-Helper-Test.ipa")
          url = f"https://github.com/{os.environ['GH_REPO']}/releases/download/v159.0.4-gecko-helper-test/Firefox-Gecko-Helper-Test.ipa"
          description = "Gecko launch diagnostic preserving required child-process helper; optional extensions and download widget removed. All embedded executable code requires signing."
          entry = dict(
              version=version,
              buildVersion=build,
              date=date,
              localizedDescription=description,
              downloadURL=url,
              size=ipa.stat().st_size,
              minOSVersion="16.1",
          )
          app["versions"] = [entry] + [e for e in app["versions"] if e["version"] != version]
          app.update(version=version, versionDate=date, versionDescription=description,
                     downloadURL=url, size=entry["size"])
          app["localizedDescription"] = (
              "Experimental Reynard/Gecko iOS browser. Current version restores essential "
              "Gecko child-process helper while omitting optional extensions. Not original Firefox UI."
          )
          path.write_text(json.dumps(source, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish essential-helper diagnostic in FlareStore source'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
