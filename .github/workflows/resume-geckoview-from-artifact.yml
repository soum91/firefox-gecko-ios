name: Resume GeckoView packaging from saved Gecko engine

on:
  workflow_dispatch:
    inputs:
      engine_run_id:
        description: "Completed Gecko build run containing Gecko-iOS-arm64-compiled-engine-dist"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  package-framework:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Reynard source
        uses: actions/checkout@v4
        with:
          repository: soum91/reynard-browser
          ref: 55eecc5b63114b0072bf14bd4c55acec01e3a40a
          path: reynard-source
          persist-credentials: false
      - name: Select matching Xcode for binary Swift module
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'
      - name: Initialize and patch Gecko source without recompiling it
        working-directory: reynard-source
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive support/idevice
          git submodule update --init --depth 1 engine/firefox
          ./tools/development/update-gecko.sh
          ./tools/development/apply-patches.sh
      - name: Download the preserved Gecko engine artifact
        uses: actions/download-artifact@v4
        with:
          name: Gecko-iOS-arm64-compiled-engine-dist
          run-id: ${{ inputs.engine_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/gecko-engine-archive
      - name: Restore engine binaries and generated headers
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gecko-engine-archive/gecko-engine-dist.tar.gz"
          obj="$GITHUB_WORKSPACE/reynard-source/engine/firefox/obj-aarch64-apple-ios"
          test -s "$archive"
          mkdir -p "$obj"
          tar -xzf "$archive" -C "$obj"
          test -d "$obj/dist/include"
          test -d "$obj/dist/bin"
          find "$obj/dist" -type f \( -iname '*xul*' -o -name 'libmozglue*' \) -print | grep -q .
      - name: Build GeckoView without incompatible Swift library evolution
        timeout-minutes: 30
        working-directory: reynard-source
        run: |
          set -o pipefail
          xcodebuild -project browser/Reynard.xcodeproj -target GeckoView \
            -configuration Release -sdk iphoneos -arch arm64 \
            SYMROOT="$RUNNER_TEMP/reynard-gecko-dev/Build/Products" \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/geckoview-dev-build.log"
          framework="$RUNNER_TEMP/reynard-gecko-dev/Build/Products/Release-iphoneos/GeckoView.framework"
          test -f "$framework/GeckoView"
          test -f "$framework/Modules/GeckoView.swiftmodule/arm64-apple-ios.swiftmodule"
          xcodebuild -create-xcframework -framework "$framework" \
            -output "$RUNNER_TEMP/GeckoView-dev.xcframework"
      - name: Upload GeckoView framework before Firefox integration
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-GeckoView-dev-xcframework
          path: ${{ runner.temp }}/GeckoView-dev.xcframework
          retention-days: 14
          if-no-files-found: error
      - name: Checkout original Firefox 159
        uses: actions/checkout@v4
        with:
          repository: mozilla-mobile/firefox-ios
          ref: firefox-v159.0
          path: firefox-source
          fetch-depth: 1
      - name: Verify GeckoView imports in Firefox BrowserKit
        run: python3 option2/tools/apply_overlay.py firefox-source "$RUNNER_TEMP/GeckoView-dev.xcframework"
      - name: Compile Firefox BrowserKit using saved Gecko engine
        timeout-minutes: 25
        working-directory: firefox-source/BrowserKit
        run: |
          set -o pipefail
          xcodebuild -skipMacroValidation -scheme WebEngine -configuration Debug \
            -destination 'generic/platform=iOS' -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/firefox-gecko-dev" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/firefox-webengine-dev-build.log"
      - name: Preserve logs regardless of result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GeckoView-resume-build-logs
          path: |
            ${{ runner.temp }}/geckoview-dev-build.log
            ${{ runner.temp }}/firefox-webengine-dev-build.log
          if-no-files-found: warn
          retention-days: 14
