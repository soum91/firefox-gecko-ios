name: Repair bundled Timbre IPA without compiling
# Repackages the newest published Native UI IPA so Timbre loads from
# resource://app/ext/timbre/ (the FetchDock route), then publishes it under the
# next free build number. No Gecko or Swift compilation.
on:
  push:
    branches: [firefox-native-gecko]
    paths:
      - .github/workflows/repair-timbre-package.yml
      - scripts/repair_timbre_package.py
      - scripts/patch_timbre_builtin.py
  workflow_dispatch:
    inputs:
      source_build:
        description: "Published native-gecko build to repackage"
        default: "52"
permissions:
  contents: write
  actions: read
concurrency:
  group: repair-timbre-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repair:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_BUILD: ${{ github.event.inputs.source_build || '52' }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the published source IPA
        run: |
          set -euo pipefail
          tag="native-gecko-159.0-build-${SOURCE_BUILD}"
          asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            --jq '.assets[] | select(.name | endswith(".ipa")) | .id' | head -n 1)
          test -n "$asset"
          mkdir -p original
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > original/source.ipa
          ls -la original
      - name: Pick the next free build number
        id: build
        run: echo "number=$(bash scripts/next_native_build.sh)" >> "$GITHUB_OUTPUT"
      - name: Point Timbre at the FetchDock resource route, sign and verify
        run: |
          python3 scripts/repair_timbre_package.py original/source.ipa \
            "$RUNNER_TEMP/ipa/Firefox-Gecko-Native-159.0-build-${{ steps.build.outputs.number }}.ipa" \
            --build "${{ steps.build.outputs.number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Firefox-Gecko-Native-159.0-build-${{ steps.build.outputs.number }}
          path: ${{ runner.temp }}/ipa/Firefox-Gecko-Native-159.0-build-${{ steps.build.outputs.number }}.ipa
          compression-level: 0
          retention-days: 14
      - name: Publish and update FlareStore
        run: |
          bash scripts/publish_native_gecko_release.sh \
            "$RUNNER_TEMP/ipa/Firefox-Gecko-Native-159.0-build-${{ steps.build.outputs.number }}.ipa" \
            "${{ steps.build.outputs.number }}" "$GITHUB_SHA"
