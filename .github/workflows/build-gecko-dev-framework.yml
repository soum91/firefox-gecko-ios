name: Build unstripped Reynard GeckoView for Firefox native shell
on:
  push:
    branches: [firefox-native-gecko]
    paths:
      - .github/workflows/build-gecko-dev-framework.yml
      - .github/scripts/**
      - option2/**
      - scripts/package_native_gecko_ipa.py
      - scripts/build_link_extensions.sh
      - scripts/publish_native_gecko_release.sh
  workflow_dispatch:
    inputs:
      force_engine_rebuild:
        description: "Ignore the cached Gecko engine and compile it again"
        type: boolean
        default: false
permissions:
  # contents: write publishes the IPA as a prerelease.
  contents: write
  actions: read
# A push while Gecko is compiling waits for that run instead of starting a
# second multi-hour compile. When it starts, the engine is already cached.
concurrency:
  group: gecko-dev-framework-${{ github.ref }}
  cancel-in-progress: false
env:
  REYNARD_REF: 55eecc5b63114b0072bf14bd4c55acec01e3a40a
  XCODE_VERSION: '26.5'
  # Bump only when the Gecko build flags or the archive layout change.
  # v2: links in dist/ are resolved, so the archive is self-contained.
  ENGINE_SCHEMA: v2
jobs:
  framework-and-firefox:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: firefox-gecko-standard
      MOZ_NOSPAM: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Reynard Gecko source
        uses: actions/checkout@v4
        with:
          repository: soum91/reynard-browser
          ref: ${{ env.REYNARD_REF }}
          path: reynard-source
          persist-credentials: false
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Compute Gecko engine key
        id: engine-key
        # The Reynard commit pins the Gecko release tag, patches and build
        # script, so it fully determines the compiled engine.
        run: |
          echo "key=gecko-engine-${ENGINE_SCHEMA}-${REYNARD_REF}-xcode${XCODE_VERSION}" >> "$GITHUB_OUTPUT"
          # Content key shared with the Reynard fork, whose nightly builds
          # publish their compiled engine under this name.
          content=$(bash .github/scripts/gecko-engine-key.sh reynard-source "--use-sccache --auto-clobber")
          echo "content=$content" >> "$GITHUB_OUTPUT"
          echo "Gecko engine content key: $content" >> "$GITHUB_STEP_SUMMARY"
      - name: Restore cached Gecko engine
        id: engine-cache
        if: github.event.inputs.force_engine_rebuild != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/gecko-engine/gecko-engine-dist.tar.gz
          key: ${{ steps.engine-key.outputs.key }}
      - name: Reuse Gecko engine from an earlier run
        id: engine-seed
        if: github.event.inputs.force_engine_rebuild != 'true' && steps.engine-cache.outputs.cache-hit != 'true'
        timeout-minutes: 170
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch-gecko-engine.sh "${{ steps.engine-key.outputs.key }}" "$REYNARD_REF" "$RUNNER_TEMP/gecko-engine" "${{ steps.engine-key.outputs.content }}"
      - name: Initialize and patch Gecko source
        working-directory: reynard-source
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive support/idevice
          git submodule update --init --depth 1 engine/firefox
          ./tools/development/update-gecko.sh
          ./tools/development/apply-patches.sh
      - name: Unpack reused Gecko engine
        id: engine-reuse
        if: steps.engine-cache.outputs.cache-hit == 'true' || steps.engine-seed.outputs.found == 'true'
        # A damaged archive falls back to compiling instead of failing the run.
        continue-on-error: true
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gecko-engine/gecko-engine-dist.tar.gz"
          obj="$GITHUB_WORKSPACE/reynard-source/engine/firefox/obj-aarch64-apple-ios"
          staging="$RUNNER_TEMP/gecko-engine-unpacked"
          test -s "$archive"
          rm -rf "$staging" && mkdir -p "$staging"
          tar -xzf "$archive" -C "$staging"
          test -d "$staging/dist/include"
          test -d "$staging/dist/bin"
          find "$staging/dist" -type f \( -iname '*xul*' -o -name 'libmozglue*' \) -print | grep -q .
          # Only move into place once validated, so a bad archive leaves the
          # object directory clean for a normal compile.
          mkdir -p "$obj"
          rm -rf "$obj/dist"
          mv "$staging/dist" "$obj/dist"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Skipping Gecko compile: reused ${{ steps.engine-key.outputs.key }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Gecko build dependencies
        if: steps.engine-reuse.outputs.ready != 'true'
        run: |
          brew install python@3.12 lld cbindgen llvm ldid
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Install Rust for iOS
        if: steps.engine-reuse.outputs.ready != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Hash Rust toolchain
        id: toolchain
        if: steps.engine-reuse.outputs.ready != 'true'
        run: echo "hash=$(rustc -Vv | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore Gecko dependency cache
        if: steps.engine-reuse.outputs.ready != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.mozbuild
          key: ffgecko-deps-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('reynard-source/engine/release.txt') }}
          restore-keys: |
            ffgecko-deps-${{ steps.toolchain.outputs.hash }}-
      - name: Enable compiler cache
        if: steps.engine-reuse.outputs.ready != 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Compile Gecko engine without desktop notifications
        id: compile-gecko
        if: steps.engine-reuse.outputs.ready != 'true'
        timeout-minutes: 300
        working-directory: reynard-source
        env:
          CC: clang
          CXX: clang++
          LD: ld64.lld
        run: |
          set -o pipefail
          ./tools/development/build-gecko.sh --use-sccache --auto-clobber 2>&1 | tee "$RUNNER_TEMP/gecko-build.log"
      - name: Preserve compiled Gecko engine before framework work
        id: archive-gecko
        if: steps.compile-gecko.outcome == 'success'
        timeout-minutes: 25
        run: |
          set -euo pipefail
          obj="$GITHUB_WORKSPACE/reynard-source/engine/firefox/obj-aarch64-apple-ios"
          test -d "$obj/dist"
          # Preserve the complete dist tree, including headers and symlinks.
          # The archive is a build snapshot, not a stand-alone iOS framework.
          find "$obj/dist" -type f \( -iname '*xul*' -o -name 'libmozglue*' \) -print \
            | tee "$RUNNER_TEMP/gecko-engine-binaries.txt"
          test -s "$RUNNER_TEMP/gecko-engine-binaries.txt"
          du -sh "$obj/dist"
          # The key file lets later runs prove the archive matches their pin.
          echo "${{ steps.engine-key.outputs.key }}" > "$obj/reynard-engine-key.txt"
          mkdir -p "$RUNNER_TEMP/gecko-engine"
          # dist/ is full of links into the source and the rest of the build
          # tree. Resolve them (-h) so the archive works on its own: v1 kept
          # the links and four runtime files dangled after a restore. A link
          # with no target only warns; the checks below decide.
          if ! tar -C "$obj" -czhf "$RUNNER_TEMP/gecko-engine/gecko-engine-dist.tar.gz" \
              reynard-engine-key.txt dist 2> "$RUNNER_TEMP/engine-tar-warnings.txt"; then
            head -n 20 "$RUNNER_TEMP/engine-tar-warnings.txt"
          fi
          gzip -t "$RUNNER_TEMP/gecko-engine/gecko-engine-dist.tar.gz"
          tar -tzf "$RUNNER_TEMP/gecko-engine/gecko-engine-dist.tar.gz" | grep -q '^dist/bin/chrome.manifest$'
          tar -tzf "$RUNNER_TEMP/gecko-engine/gecko-engine-dist.tar.gz" | grep -q '^dist/bin/default.locale$'
          test -s "$RUNNER_TEMP/gecko-engine/gecko-engine-dist.tar.gz"
          shasum -a 256 "$RUNNER_TEMP/gecko-engine/gecko-engine-dist.tar.gz"
      - name: Cache compiled Gecko engine immediately
        # Saved now, not at job end, so a later GeckoView or Firefox failure
        # can never throw away a finished engine compile.
        if: steps.archive-gecko.outcome == 'success' || (steps.engine-seed.outputs.found == 'true' && steps.engine-reuse.outputs.ready == 'true')
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/gecko-engine/gecko-engine-dist.tar.gz
          key: ${{ steps.engine-key.outputs.key }}
      - name: Upload compiled Gecko engine (independent of GeckoView)
        id: upload-gecko
        if: steps.archive-gecko.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Gecko-iOS-arm64-compiled-engine-dist
          path: ${{ runner.temp }}/gecko-engine/gecko-engine-dist.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Salvage Gecko engine files if archive or upload fails
        if: failure() && (steps.archive-gecko.outcome == 'failure' || steps.upload-gecko.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: Gecko-iOS-arm64-raw-binaries-fallback
          path: reynard-source/engine/firefox/obj-aarch64-apple-ios/dist/bin/
          retention-days: 14
          if-no-files-found: warn
      - name: Record compiler cache statistics
        if: steps.compile-gecko.outcome == 'success'
        run: sccache --show-stats || true
      - name: Build original Reynard GeckoView Swift framework (unstripped)
        timeout-minutes: 25
        working-directory: reynard-source
        run: |
          set -o pipefail
          # Previous workflow failed because -destination and -arch conflict.
          # Build the actual framework target, not the Reynard app or a nonexistent
          # shared GeckoView scheme, and locate products under a stable SYMROOT.
          # This target uses an Objective-C bridging header, which Swift cannot
          # compile together with BUILD_LIBRARY_FOR_DISTRIBUTION=YES. Ship the
          # architecture-specific binary Swift module and pin consumers to the
          # same Xcode 26.5 toolchain instead of requesting a swiftinterface.
          xcodebuild -project browser/Reynard.xcodeproj -target GeckoView \
            -configuration Release -sdk iphoneos -arch arm64 \
            SYMROOT="$RUNNER_TEMP/reynard-gecko-dev/Build/Products" \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/geckoview-dev-build.log"
          FRAMEWORK="$RUNNER_TEMP/reynard-gecko-dev/Build/Products/Release-iphoneos/GeckoView.framework"
          test -f "$FRAMEWORK/GeckoView"
          test -d "$FRAMEWORK/Modules/GeckoView.swiftmodule"
          find "$FRAMEWORK/Modules/GeckoView.swiftmodule" -type f
          find "$FRAMEWORK/Modules/GeckoView.swiftmodule" -name 'arm64-apple-ios.swiftmodule' | grep -q .
          # The module is a binary .swiftmodule with no .swiftinterface (see
          # BUILD_LIBRARY_FOR_DISTRIBUTION=NO above). create-xcframework rejects
          # that with exit 70 unless internal distribution is allowed. Log its
          # output too, so a failure here shows up on the run page.
          xcodebuild -create-xcframework -allow-internal-distribution \
            -framework "$FRAMEWORK" \
            -output "$RUNNER_TEMP/GeckoView-dev.xcframework" 2>&1 | tee -a "$RUNNER_TEMP/geckoview-dev-build.log"
          test -f "$RUNNER_TEMP/GeckoView-dev.xcframework/Info.plist"
      - name: Upload unstripped GeckoView developer framework
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-GeckoView-dev-xcframework
          path: ${{ runner.temp }}/GeckoView-dev.xcframework
          retention-days: 14
          if-no-files-found: error
      - name: Checkout native Firefox 159 source
        uses: actions/checkout@v4
        with:
          repository: mozilla-mobile/firefox-ios
          ref: firefox-v159.0
          path: firefox-source
          fetch-depth: 1
      - name: Apply Gecko developer framework to Firefox BrowserKit
        run: python3 option2/tools/apply_overlay.py firefox-source "$RUNNER_TEMP/GeckoView-dev.xcframework"
      - name: Actually compile Firefox BrowserKit against Reynard Gecko
        timeout-minutes: 25
        working-directory: firefox-source/BrowserKit
        run: |
          set -o pipefail
          # GeckoView's module records Reynard's bridging header; give the
          # importer the header folders Reynard's own build uses.
          gecko_flags=$(bash "$GITHUB_WORKSPACE/.github/scripts/geckoview-client-swift-flags.sh" "$GITHUB_WORKSPACE/reynard-source")
          echo "GeckoView client flags: $gecko_flags"
          xcodebuild -skipMacroValidation -scheme WebEngine -configuration Debug \
            -destination 'generic/platform=iOS' -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/firefox-gecko-dev" \
            CODE_SIGNING_ALLOWED=NO OTHER_SWIFT_FLAGS='$(inherited)'" $gecko_flags" \
            build 2>&1 | tee "$RUNNER_TEMP/firefox-webengine-dev-build.log"
      - name: Build Reynard Gecko child-process helper extension
        timeout-minutes: 20
        working-directory: reynard-source
        run: |
          set -o pipefail
          # Gecko launches its content process from PlugIns/Reynard Helper.appex.
          xcodebuild -project browser/Reynard.xcodeproj -target "Reynard Helper" \
            -configuration Release -sdk iphoneos -arch arm64 \
            SYMROOT="$RUNNER_TEMP/reynard-gecko-dev/Build/Products" \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/gecko-helper-build.log"
          test -d "$RUNNER_TEMP/reynard-gecko-dev/Build/Products/Release-iphoneos/Reynard Helper.appex"
      - name: Build Safari redirect and share sheet extensions
        timeout-minutes: 10
        run: |
          set -o pipefail
          bash scripts/build_link_extensions.sh "$RUNNER_TEMP/link-extensions" 2>&1 | tee "$RUNNER_TEMP/link-extensions-build.log"
      - name: Bootstrap Firefox app build tools
        timeout-minutes: 25
        working-directory: firefox-source
        run: |
          set -o pipefail
          bash ./bootstrap.sh firefox 2>&1 | tee "$RUNNER_TEMP/firefox-bootstrap.log"
      - name: Run Firefox on Gecko (startup and tab rendering overlay)
        run: python3 option2/tools/apply_client_overlay.py firefox-source reynard-source
      - name: Build Firefox 159 app with Gecko tabs
        timeout-minutes: 100
        working-directory: firefox-source
        run: |
          set -o pipefail
          gecko_flags=$(bash "$GITHUB_WORKSPACE/.github/scripts/geckoview-client-swift-flags.sh" "$GITHUB_WORKSPACE/reynard-source")
          framework=$(find "$RUNNER_TEMP/GeckoView-dev.xcframework" -maxdepth 2 -name GeckoView.framework -type d | head -n 1)
          test -n "$framework"
          slice=$(dirname "$framework")
          echo "GeckoView client flags: $gecko_flags -F $slice"
          xcodebuild -skipMacroValidation -project firefox-ios/Client.xcodeproj -scheme Fennec \
            -configuration Debug -destination 'generic/platform=iOS' -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/firefox-app" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            OTHER_SWIFT_FLAGS='$(inherited)'" $gecko_flags -F $slice" \
            build 2>&1 | tee "$RUNNER_TEMP/firefox-app-build.log"
      - name: Package Firefox Gecko IPA
        id: ipa
        run: |
          set -euo pipefail
          app=$(find "$RUNNER_TEMP/firefox-app/Build/Products" -path '*-iphoneos/Client.app' -type d | head -n 1)
          test -n "$app"
          build="${{ github.run_number }}"
          products="$RUNNER_TEMP/reynard-gecko-dev/Build/Products/Release-iphoneos"
          out="$RUNNER_TEMP/ipa/Firefox-Gecko-Native-159.0-build-${build}.ipa"
          python3 scripts/package_native_gecko_ipa.py --app "$app" \
            --helper "$products/Reynard Helper.appex" \
            --framework "$products/GeckoView.framework" \
            --dist-bin reynard-source/engine/firefox/obj-aarch64-apple-ios/dist/bin \
            --default-theme reynard-source/engine/firefox/toolkit/mozapps/extensions/default-theme \
            --companion reynard-source/addons/fetchdock \
            --extension "$RUNNER_TEMP/link-extensions/SafariRedirect.appex" \
            --extension "$RUNNER_TEMP/link-extensions/ShareTo.appex" \
            --output "$out" --version "159.0.${build}" --build "$build" --missing-report "$RUNNER_TEMP/missing-gecko-files.txt" \
            2>&1 | tee "$RUNNER_TEMP/ipa-package.log"
          echo "path=$out" >> "$GITHUB_OUTPUT"
      - name: Upload Firefox Gecko IPA
        uses: actions/upload-artifact@v4
        with:
          name: Firefox-Gecko-Native-159.0-build-${{ github.run_number }}
          path: ${{ steps.ipa.outputs.path }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Publish prerelease with build number and changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          bash scripts/publish_native_gecko_release.sh "${{ steps.ipa.outputs.path }}" \
            "${{ github.run_number }}" "$GITHUB_SHA" "$RUNNER_TEMP/missing-gecko-files.txt" \
            2>&1 | tee "$RUNNER_TEMP/publish.log"
      - name: Show the real compiler errors on the run page
        if: failure()
        run: |
          bash .github/scripts/surface-build-errors.sh \
            "$RUNNER_TEMP/gecko-build.log" \
            "$RUNNER_TEMP/geckoview-dev-build.log" \
            "$RUNNER_TEMP/firefox-webengine-dev-build.log" \
            "$RUNNER_TEMP/gecko-helper-build.log" \
            "$RUNNER_TEMP/firefox-bootstrap.log" \
            "$RUNNER_TEMP/firefox-app-build.log" \
            "$RUNNER_TEMP/ipa-package.log" \
            "$RUNNER_TEMP/publish.log"
      - name: Trim Gecko compile log for upload
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/gecko-build.log" ]; then
            tail -n 4000 "$RUNNER_TEMP/gecko-build.log" > "$RUNNER_TEMP/gecko-build-tail.log"
          fi
      - name: Upload developer build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gecko-dev-framework-and-Firefox-compile-logs
          path: |
            ${{ runner.temp }}/gecko-build-tail.log
            ${{ runner.temp }}/geckoview-dev-build.log
            ${{ runner.temp }}/firefox-webengine-dev-build.log
            ${{ runner.temp }}/gecko-helper-build.log
            ${{ runner.temp }}/firefox-bootstrap.log
            ${{ runner.temp }}/firefox-app-build.log
            ${{ runner.temp }}/ipa-package.log
          if-no-files-found: warn
          retention-days: 14
